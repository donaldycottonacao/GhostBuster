name: GhostBuster CI

on:
  push:
    branches: [ main, master, development, develop ]
  pull_request:
    branches: [ main, master, development, develop ]

jobs:
  flutter-ci:
    name: Flutter Frontend Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run widget and unit tests
        run: flutter test

  python-ci:
    name: Python Backend Tools Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python script syntax
        run: python -m compileall scripts tests

      - name: Run Python CLI smoke tests
        run: python -m unittest tests/test_cli.py
