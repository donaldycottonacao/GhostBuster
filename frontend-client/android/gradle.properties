# Raise the Gradle JVM heap. assembleDebug compiles Flutter + Kotlin + the
# native record/jni code, which exhausts the default heap on CI runners
# (java.lang.OutOfMemoryError: Java heap space). 4 GB is comfortable on the
# 16 GB GitHub-hosted runners and on typical dev machines.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
