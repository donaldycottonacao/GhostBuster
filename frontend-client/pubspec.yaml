name: frontend_client
description: "GhostBuster - Simulated tactical social escape call frontend application."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Use the version pinned by flutter_localizations.
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Deterministic fake clock for timer tests. Already a transitive dependency of
  # flutter_test; `any` keeps the version the Flutter SDK pins (currently 1.3.3).
  fake_async: any
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  generate: true

  # Asset directories registered for optional ringtones, dialogues, and custom fonts.
  # Safe placeholders (README.md) exist in both directories so compilation succeeds
  # even before binary media files are added.
  assets:
    - assets/audio/
    - assets/fonts/
